site_name: Hikvision Driver — Manual
site_description: >-
  Manual de instalação, configuração e operação do driver de integração entre
  controladoras Hikvision e as plataformas Senior X e Senior XT.
docs_dir: docs
site_dir: site
copyright: Hikvision Driver 2.2.1 — Manual do produto

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - content.tabs.link
    - content.code.copy
    - search.highlight
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang: pt

nav:
  - Início: index.md
  - Guia Senior X: guia-senior-x.md
  - Guia Senior XT: guia-senior-xt.md
  - Propriedades: propriedades.md
  - Problemas: problemas.md
